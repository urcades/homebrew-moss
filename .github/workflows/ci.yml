name: CI

on:
  push:
  pull_request:

jobs:
  formula:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Tap local checkout
        run: brew tap --force urcades/moss "$GITHUB_WORKSPACE"
      - name: Audit formula
        run: brew audit --strict --online urcades/moss/moss
      - name: Install formula
        run: brew install --build-from-source urcades/moss/moss
      - name: Test formula
        run: brew test urcades/moss/moss
